name: Bug report
description: Something in the MCP server or the manifests does not work
labels: [bug]
body:
  - type: input
    id: client
    attributes:
      label: Client
      description: Which client and version (Claude, Cursor, VS Code, Gemini CLI...)
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: The tool or method you called and the arguments. Remove any connection key.
      render: json
    validations:
      required: true
  - type: textarea
    id: response
    attributes:
      label: What happened
      description: The response or error you got, and what you expected.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed connection keys and personal health details from this issue.
          required: true
